name: Extract StudyDeck project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project files
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import PurePosixPath
          from pathlib import Path

          archive = Path("studydeck-platform-starter.zip")

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  p = PurePosixPath(item.filename)
                  if len(p.parts) < 2 or p.parts[0] != "studydeck-platform":
                      continue
                  target = Path(*p.parts[1:])
                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(z.read(item))

          PY

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add StudyDeck project source files" || echo "No changes"
          git push
